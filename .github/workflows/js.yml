name: JavaScript

on:
  push:
    branches: [main]
    paths: ["js/**", "spec/**", ".github/workflows/js.yml"]
  pull_request:
    paths: ["js/**", "spec/**", ".github/workflows/js.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: js/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn run check
