version: "2"

linters:
  default: standard
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        # Unchecked errors: errcheck already runs.
        - G104
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    rules:
      # Tests build fixtures with unbounded reads of their own data, bounded conversions, fixed
      # paths and math/rand inputs; none of it runs in an application.
      - path: _test\.go
        linters: [gosec]
        text: "G102|G103|G110|G115|G116|G204|G301|G304|G306|G404|G602|G702|G703"
      # SHA-1 computes Sec-WebSocket-Accept as RFC 6455 § 4.2.2 requires; it protects nothing.
      - path: internal/websocket/fn\.go
        linters: [gosec]
        text: "G401|G505"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
